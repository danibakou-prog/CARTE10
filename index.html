<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عدّاد المنتجات</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #a855f7;
            --primary-dark: #7c3aed;
            --accent: #06b6d4;
            --accent-dark: #0891b2;
            --pink: #ec4899;
            --success: #10b981;
            --success-dark: #059669;
            --danger: #ef4444;
            --danger-dark: #dc2626;
            --warning: #f59e0b;
            --gold: #fbbf24;
            --bg-1: #0a0a1a;
            --bg-2: #1a1a2e;
            --bg-3: #16213e;
            --text: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.6);
            --text-muted: rgba(255, 255, 255, 0.35);
            --glass: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: 
                radial-gradient(circle at 20% 10%, rgba(168, 85, 247, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.08) 0%, transparent 50%),
                linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
            min-height: 100vh;
            color: var(--text);
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(circle at 1px 1px, rgba(255,255,255,0.03) 1px, transparent 0);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        /* ===== HEADER ===== */
        .header {
            background: rgba(10, 10, 26, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--glass-border);
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 800;
            background: linear-gradient(90deg, #a855f7, #ec4899, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            flex: 1;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .add-product-btn {
            background: linear-gradient(135deg, var(--primary), var(--pink));
            border: none;
            color: #fff;
            padding: 10px 16px;
            border-radius: 14px;
            font-size: 1.3rem;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 
                0 6px 20px rgba(168, 85, 247, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            position: relative;
            overflow: hidden;
        }

        .add-product-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .add-product-btn:hover::before {
            left: 100%;
        }

        .add-product-btn:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 10px 28px rgba(168, 85, 247, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .add-product-btn:active {
            transform: scale(0.95);
        }

        .add-product-btn .btn-text {
            font-size: 0.85rem;
        }

        /* ===== PRODUCTS STRIP ===== */
        .products-strip {
            background: rgba(10, 10, 26, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: 14px 12px;
            position: sticky;
            top: 68px;
            z-index: 99;
        }

        .products-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 6px 4px;
            scroll-behavior: smooth;
            scrollbar-width: thin;
        }

        .products-scroll::-webkit-scrollbar {
            height: 4px;
        }

        .products-scroll::-webkit-scrollbar-thumb {
            background: linear-gradient(90deg, var(--primary), var(--pink));
            border-radius: 4px;
        }

        .product-chip {
            flex-shrink: 0;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            min-width: 165px;
            backdrop-filter: blur(10px);
        }

        .product-chip:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-3px);
            border-color: rgba(168, 85, 247, 0.3);
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.15);
        }

        .product-chip.active {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(236, 72, 153, 0.15));
            border-color: var(--primary);
            box-shadow: 
                0 8px 25px rgba(168, 85, 247, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .chip-icon {
            width: 44px;
            height: 44px;
            border-radius: 13px;
            background: linear-gradient(135deg, var(--primary), var(--pink));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3);
        }

        .chip-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .chip-name {
            font-size: 0.9rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 110px;
        }

        .chip-weight {
            font-size: 0.7rem;
            color: var(--text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chip-count {
            position: absolute;
            top: -7px;
            left: -7px;
            background: linear-gradient(135deg, var(--success), #34d399);
            color: #fff;
            font-size: 0.72rem;
            font-weight: 800;
            padding: 3px 9px;
            border-radius: 11px;
            min-width: 26px;
            text-align: center;
            box-shadow: 
                0 3px 12px rgba(16, 185, 129, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .chip-delete {
            position: absolute;
            top: -7px;
            right: -7px;
            background: linear-gradient(135deg, var(--danger), #f87171);
            color: #fff;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-size: 0.8rem;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 12px rgba(239, 68, 68, 0.5);
            line-height: 1;
            transition: all 0.2s;
        }

        .chip-delete:hover {
            transform: scale(1.15) rotate(90deg);
        }

        .product-chip:hover .chip-delete {
            display: flex;
        }

        .empty-strip {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
            padding: 10px;
            width: 100%;
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 24px 16px 50px;
            position: relative;
            z-index: 1;
        }

        /* ===== PRODUCT CARD ===== */
        .product-card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 32px 22px;
            text-align: center;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.08) 0%, transparent 60%);
            animation: pulse 5s ease-in-out infinite;
        }

        .product-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.15); opacity: 1; }
        }

        .product-icon {
            width: 110px;
            height: 110px;
            margin: 0 auto 18px;
            background: linear-gradient(135deg, var(--primary), var(--pink));
            border-radius: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            position: relative;
            z-index: 1;
            box-shadow: 
                0 15px 40px rgba(168, 85, 247, 0.4),
                inset 0 2px 0 rgba(255, 255, 255, 0.2);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .product-name {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 6px;
            position: relative;
            z-index: 1;
            background: linear-gradient(90deg, #fff, #e0e7ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .product-weight {
            font-size: 0.95rem;
            color: var(--text-dim);
            margin-bottom: 28px;
            position: relative;
            z-index: 1;
        }

        /* ===== COUNTER ===== */
        .counter-display {
            position: relative;
            z-index: 1;
            margin-bottom: 14px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
        }

        .counter-number {
            font-size: 5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #06b6d4, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            transition: transform 0.3s;
            text-shadow: 0 0 40px rgba(168, 85, 247, 0.3);
            letter-spacing: -2px;
        }

        .counter-number.bump {
            animation: bump 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes bump {
            0% { transform: scale(1); }
            40% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }

        .counter-label {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        /* ===== BUTTONS ===== */
        .buttons-row {
            display: flex;
            gap: 14px;
            justify-content: center;
            margin-bottom: 28px;
            position: relative;
            z-index: 1;
        }

        .scan-btn {
            flex: 1;
            max-width: 170px;
            padding: 18px 12px;
            border: none;
            border-radius: 18px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        .scan-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            transition: left 0.5s;
        }

        .scan-btn:hover::before {
            left: 100%;
        }

        .scan-btn:active {
            transform: scale(0.93);
        }

        .btn-add {
            background: linear-gradient(135deg, var(--success), #34d399);
            box-shadow: 
                0 10px 30px rgba(16, 185, 129, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        .btn-add:hover {
            box-shadow: 
                0 14px 40px rgba(16, 185, 129, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .btn-remove {
            background: linear-gradient(135deg, var(--danger), #f87171);
            box-shadow: 
                0 10px 30px rgba(239, 68, 68, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        .btn-remove:hover {
            box-shadow: 
                0 14px 40px rgba(239, 68, 68, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .btn-icon {
            font-size: 2.2rem;
            line-height: 1;
            font-weight: 300;
        }

        /* ===== CODES LIST ===== */
        .list-section {
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            padding: 22px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--glass-border);
        }

        .list-title {
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(90deg, #fff, #c7d2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .clear-btn {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 7px 14px;
            border-radius: 11px;
            font-size: 0.8rem;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
            font-weight: 600;
        }

        .clear-btn:hover {
            background: rgba(239, 68, 68, 0.3);
            transform: translateY(-1px);
        }

        .codes-list {
            max-height: 380px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            scrollbar-width: thin;
        }

        .codes-list::-webkit-scrollbar {
            width: 4px;
        }

        .codes-list::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--primary), var(--pink));
            border-radius: 4px;
        }

        .code-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 13px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            direction: ltr;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .code-item::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 3px; height: 100%;
            background: linear-gradient(180deg, var(--accent), var(--primary));
            opacity: 0.5;
        }

        .code-item:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(168, 85, 247, 0.2);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .code-text {
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
            color: var(--accent);
            letter-spacing: 1px;
            font-weight: 600;
        }

        .code-time {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .code-duplicate-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            background: linear-gradient(135deg, var(--warning), #fbbf24);
            color: #1a1a2e;
            font-size: 0.68rem;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 8px;
            margin-right: 8px;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.3);
        }

        .code-delete {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .code-delete:hover {
            color: #f87171;
            background: rgba(239, 68, 68, 0.15);
            transform: scale(1.15);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .empty-state .empty-icon {
            font-size: 3rem;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        .no-product-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
        }

        .no-product-state .big-icon {
            font-size: 4.5rem;
            margin-bottom: 16px;
            animation: float 4s ease-in-out infinite;
        }

        .no-product-state .big-text {
            font-size: 1.15rem;
            margin-bottom: 24px;
            font-weight: 600;
        }

        .no-product-state .create-btn {
            background: linear-gradient(135deg, var(--primary), var(--pink));
            color: #fff;
            border: none;
            padding: 14px 28px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 
                0 10px 30px rgba(168, 85, 247, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
        }

        .no-product-state .create-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 40px rgba(168, 85, 247, 0.55);
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.98), rgba(22, 33, 62, 0.98));
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 26px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            scrollbar-width: thin;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 800;
            margin-bottom: 6px;
            background: linear-gradient(90deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .modal-subtitle {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 22px;
        }

        #reader {
            width: 100%;
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 18px;
            border: 2px solid var(--glass-border);
        }

        #reader video {
            border-radius: 16px;
        }

        .manual-input {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
        }

        .manual-input input {
            flex: 1;
            padding: 13px 16px;
            border-radius: 13px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 1rem;
            font-family: 'Courier New', monospace;
            text-align: center;
            direction: ltr;
            outline: none;
            transition: all 0.3s;
        }

        .manual-input input:focus {
            border-color: var(--primary);
            background: rgba(168, 85, 247, 0.08);
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.15);
        }

        .manual-input input::placeholder {
            color: var(--text-muted);
        }

        .manual-submit {
            padding: 13px 22px;
            border-radius: 13px;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--pink));
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.3);
        }

        .manual-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(168, 85, 247, 0.45);
        }

        .close-modal {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
        }

        .close-modal:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* ===== NEW PRODUCT FORM ===== */
        .form-group {
            margin-bottom: 18px;
            text-align: right;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-input {
            width: 100%;
            padding: 13px 16px;
            border-radius: 13px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            text-align: right;
            direction: rtl;
            transition: all 0.3s;
        }

        .form-input:focus {
            border-color: var(--primary);
            background: rgba(168, 85, 247, 0.08);
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.15);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .emoji-picker {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            padding: 14px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            max-height: 200px;
            overflow-y: auto;
            scrollbar-width: thin;
        }

        .emoji-option {
            width: 46px;
            height: 46px;
            border-radius: 13px;
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid transparent;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .emoji-option:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.12);
        }

        .emoji-option.selected {
            border-color: var(--primary);
            background: rgba(168, 85, 247, 0.2);
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.15);
        }

        .submit-product-btn {
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            border: none;
            background: linear-gradient(135deg, var(--success), #34d399);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            margin-top: 10px;
            box-shadow: 
                0 10px 30px rgba(16, 185, 129, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
        }

        .submit-product-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 35px rgba(16, 185, 129, 0.5);
        }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed;
            top: 85px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            width: 90%;
            max-width: 380px;
        }

        .toast {
            padding: 14px 22px;
            border-radius: 14px;
            font-size: 0.9rem;
            font-weight: 600;
            animation: toastIn 0.4s cubic-bezier(0.4, 0, 0.2, 1), toastOut 0.4s ease 2.6s forwards;
            white-space: nowrap;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            pointer-events: auto;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            position: relative;
        }

        .toast::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            height: 3px;
            width: 100%;
            background: rgba(255, 255, 255, 0.3);
            animation: shrink 3s linear forwards;
            transform-origin: right;
        }

        @keyframes shrink {
            from { transform: scaleX(1); }
            to { transform: scaleX(0); }
        }

        .toast-success {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.95), rgba(52, 211, 153, 0.95));
            color: #fff;
        }

        .toast-error {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.95), rgba(248, 113, 113, 0.95));
            color: #fff;
        }

        .toast-info {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.95), rgba(168, 85, 247, 0.95));
            color: #fff;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-25px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes toastOut {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(-25px) scale(0.9); }
        }

        /* ===== SOUND TOGGLE ===== */
        .sound-toggle {
            position: fixed;
            bottom: 22px;
            left: 22px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            color: #fff;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            transition: all 0.3s;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .sound-toggle:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: scale(1.08);
            border-color: var(--primary);
        }

        .sound-toggle.muted {
            opacity: 0.45;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 380px) {
            .counter-number { font-size: 4rem; }
            .product-icon { width: 90px; height: 90px; font-size: 42px; }
            .header h1 { font-size: 1.05rem; }
            .add-product-btn .btn-text { display: none; }
            .product-card { padding: 26px 18px; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <button class="add-product-btn" onclick="openNewProductModal()" title="إضافة منتج جديد">
            <span>＋</span>
            <span class="btn-text">منتج</span>
        </button>
        <h1>📦 نظام عدّاد المنتجات</h1>
        <div style="width: 70px;"></div>
    </div>

    <!-- PRODUCTS STRIP -->
    <div class="products-strip">
        <div class="products-scroll" id="productsScroll"></div>
    </div>

    <!-- TOAST CONTAINER -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- SOUND TOGGLE -->
    <button class="sound-toggle" id="soundToggle" onclick="toggleSound()" title="تشغيل/إيقاف الصوت">
        🔊
    </button>

    <!-- MAIN -->
    <div class="container" id="mainContainer">
        <!-- Content will be rendered dynamically -->
    </div>

    <!-- SCANNER MODAL -->
    <div class="modal-overlay" id="scannerModal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">مسح الرقم التسلسلي</div>
            <div class="modal-subtitle" id="modalSubtitle">وجّه الكاميرا نحو الباركود أو الرقم التسلسلي</div>

            <div id="reader"></div>

            <div style="color: var(--text-muted); font-size: 0.8rem; margin-bottom: 12px;">— أو أدخل الرقم يدوياً —</div>

            <div class="manual-input">
                <input type="text" id="manualCode" placeholder="أدخل الرقم التسلسلي" />
                <button class="manual-submit" onclick="handleManualInput()">تأكيد</button>
            </div>

            <button class="close-modal" onclick="closeScanner()">إغلاق الكاميرا</button>
        </div>
    </div>

    <!-- NEW PRODUCT MODAL -->
    <div class="modal-overlay" id="newProductModal">
        <div class="modal-content">
            <div class="modal-title">➕ إضافة منتج جديد</div>
            <div class="modal-subtitle">أدخل بيانات المنتج الذي تريد إضافته</div>

            <div class="form-group">
                <label class="form-label">اسم المنتج</label>
                <input type="text" class="form-input" id="newProductName" placeholder="مثال: ورق A4" maxlength="30" />
            </div>

            <div class="form-group">
                <label class="form-label">الوصف / الوزن</label>
                <input type="text" class="form-input" id="newProductWeight" placeholder="مثال: 260 غرام / م²" maxlength="40" />
            </div>

            <div class="form-group">
                <label class="form-label">اختر أيقونة</label>
                <div class="emoji-picker" id="emojiPicker"></div>
            </div>

            <button class="submit-product-btn" onclick="createNewProduct()">✓ إنشاء المنتج</button>
            <button class="close-modal" style="margin-top: 10px;" onclick="closeNewProductModal()">إلغاء</button>
        </div>
    </div>

    <script>
        // ===== STATE =====
        let products = JSON.parse(localStorage.getItem('products_v3') || 'null');
        let activeProductId = localStorage.getItem('activeProductId') || null;
        let currentMode = 'add';
        let html5QrCode = null;
        let isScanning = false;
        let selectedEmoji = '📦';
        let soundEnabled = localStorage.getItem('soundEnabled') !== 'false';

        // ===== DEFAULT EMOJIS =====
        const defaultEmojis = ['📦','📄','📋','📎','🖨️','📚','📝','✏️','🎁','🛍️','🧴','🧼','🥤','🍫','🍪','☕','🧃','🥫','🧊','💊','🧪','🔌','💡','🔋','🧰','🔧','🪛','🧲','🧵','🪡','🧶','🎨','🖼️','🪴','🌱','🍎','🍌','🥖','🧀','🥩','🐟','🍗','🍕','🌮','🍔','🍟','🧁','🍰','🎂','🍩'];

        // ===== MIGRATE FROM OLD VERSIONS =====
        function migrateOldData() {
            if (!products) {
                // Try v2 first
                const v2 = JSON.parse(localStorage.getItem('products_v2') || 'null');
                if (v2 && v2.length > 0) {
                    products = v2;
                    activeProductId = localStorage.getItem('activeProductId') || (products[0]?.id || null);
                    saveProducts();
                    return;
                }
                // Try legacy
                const oldCodes = JSON.parse(localStorage.getItem('paper260_codes') || '[]');
                if (oldCodes.length > 0) {
                    const defaultProduct = {
                        id: 'p_' + Date.now(),
                        name: 'ورق طباعة',
                        weight: '260 غرام / م²',
                        icon: '📄',
                        codes: oldCodes,
                        createdAt: Date.now()
                    };
                    products = [defaultProduct];
                    activeProductId = defaultProduct.id;
                } else {
                    products = [];
                }
                saveProducts();
            }
        }

        // ===== AUDIO CONTEXT =====
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    return null;
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
            return audioCtx;
        }

        function playAddSound() {
            if (!soundEnabled) return;
            const ctx = getAudioContext();
            if (!ctx) return;
            const now = ctx.currentTime;

            // Pleasant ascending chord
            [659, 831, 1047].forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + i * 0.06);
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.18, now + i * 0.06 + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.25);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now + i * 0.06);
                osc.stop(now + i * 0.06 + 0.26);
            });
        }

        function playRemoveSound() {
            if (!soundEnabled) return;
            const ctx = getAudioContext();
            if (!ctx) return;
            const now = ctx.currentTime;

            // Descending tone
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.exponentialRampToValueAtTime(220, now + 0.25);
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.2, now + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.31);
        }

        function playErrorSound() {
            if (!soundEnabled) return;
            const ctx = getAudioContext();
            if (!ctx) return;
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(180, now);
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.1, now + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.19);
        }

        // ===== SOUND TOGGLE =====
        function toggleSound() {
            soundEnabled = !soundEnabled;
            localStorage.setItem('soundEnabled', soundEnabled);
            updateSoundButton();
            if (soundEnabled) {
                showToast('🔊 تم تشغيل الصوت', 'info');
                playAddSound();
            } else {
                showToast('🔇 تم إيقاف الصوت', 'info');
            }
        }

        function updateSoundButton() {
            const btn = document.getElementById('soundToggle');
            if (!btn) return;
            btn.textContent = soundEnabled ? '🔊' : '🔇';
            btn.classList.toggle('muted', !soundEnabled);
        }

        // ===== INIT =====
        document.addEventListener('DOMContentLoaded', () => {
            migrateOldData();
            renderEmojiPicker();
            renderProductsStrip();
            renderMainContent();
            updateSoundButton();

            const unlockAudio = () => {
                getAudioContext();
                document.removeEventListener('click', unlockAudio);
                document.removeEventListener('touchstart', unlockAudio);
            };
            document.addEventListener('click', unlockAudio);
            document.addEventListener('touchstart', unlockAudio);
        });

        // ===== SAVE =====
        function saveProducts() {
            localStorage.setItem('products_v3', JSON.stringify(products));
            localStorage.setItem('activeProductId', activeProductId || '');
        }

        function getActiveProduct() {
            return products.find(p => p.id === activeProductId);
        }

        // ===== TOAST =====
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // ===== RENDER PRODUCTS STRIP =====
        function renderProductsStrip() {
            const scroll = document.getElementById('productsScroll');

            if (products.length === 0) {
                scroll.innerHTML = `<div class="empty-strip">لا توجد منتجات — اضغط "＋ منتج" لإضافة منتج جديد</div>`;
                return;
            }

            scroll.innerHTML = products.map(p => `
                <div class="product-chip ${p.id === activeProductId ? 'active' : ''}" onclick="selectProduct('${p.id}')">
                    <div class="chip-icon">${p.icon}</div>
                    <div class="chip-info">
                        <div class="chip-name">${escapeHtml(p.name)}</div>
                        <div class="chip-weight">${escapeHtml(p.weight || '—')}</div>
                    </div>
                    <div class="chip-count">${p.codes.length}</div>
                    <button class="chip-delete" onclick="event.stopPropagation(); deleteProduct('${p.id}')" title="حذف المنتج">✕</button>
                </div>
            `).join('');
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        // ===== SELECT PRODUCT =====
        function selectProduct(id) {
            activeProductId = id;
            saveProducts();
            renderProductsStrip();
            renderMainContent();
        }

        // ===== DELETE PRODUCT =====
        function deleteProduct(id) {
            const p = products.find(x => x.id === id);
            if (!p) return;
            if (!confirm(`هل أنت متأكد من حذف المنتج "${p.name}" وكل أرقامه؟`)) return;

            products = products.filter(x => x.id !== id);
            if (activeProductId === id) {
                activeProductId = products.length > 0 ? products[0].id : null;
            }
            saveProducts();
            renderProductsStrip();
            renderMainContent();
            showToast('🗑️ تم حذف المنتج', 'info');
        }

        // ===== RENDER MAIN CONTENT =====
        function renderMainContent() {
            const container = document.getElementById('mainContainer');
            const product = getActiveProduct();

            if (!product) {
                container.innerHTML = `
                    <div class="product-card">
                        <div class="no-product-state">
                            <div class="big-icon">📦</div>
                            <div class="big-text">لا يوجد أي منتج بعد</div>
                            <button class="create-btn" onclick="openNewProductModal()">➕ إضافة منتج جديد</button>
                        </div>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="product-card">
                    <div class="product-icon">${product.icon}</div>
                    <div class="product-name">${escapeHtml(product.name)}</div>
                    <div class="product-weight">${escapeHtml(product.weight || '—')}</div>

                    <div class="counter-display">
                        <div class="counter-number" id="counter">${product.codes.length}</div>
                        <div class="counter-label">العدد المسجّل</div>
                    </div>

                    <div class="buttons-row">
                        <button class="scan-btn btn-add" onclick="openScanner('add')">
                            <span class="btn-icon">＋</span>
                            <span>إضافة</span>
                        </button>
                        <button class="scan-btn btn-remove" onclick="openScanner('remove')">
                            <span class="btn-icon">－</span>
                            <span>حذف</span>
                        </button>
                    </div>
                </div>

                <div class="list-section">
                    <div class="list-header">
                        <span class="list-title">📋 الأرقام التسلسلية</span>
                        <button class="clear-btn" onclick="clearAll()">مسح الكل</button>
                    </div>
                    <div class="codes-list" id="codesList"></div>
                </div>
            `;

            renderCodesList();
        }

        // ===== RENDER CODES LIST =====
        function renderCodesList() {
            const list = document.getElementById('codesList');
            if (!list) return;
            const product = getActiveProduct();
            if (!product) return;

            if (product.codes.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📭</div>
                        <div>لا توجد أرقام مسجّلة بعد</div>
                    </div>`;
                return;
            }

            // Count duplicates for badge display
            const codeCounts = {};
            product.codes.forEach(item => {
                codeCounts[item.code] = (codeCounts[item.code] || 0) + 1;
            });

            list.innerHTML = product.codes.map((item, index) => {
                const count = codeCounts[item.code];
                const duplicateBadge = count > 1 
                    ? `<span class="code-duplicate-badge">×${count}</span>` 
                    : '';
                return `
                    <div class="code-item">
                        <div>
                            <div class="code-text">${escapeHtml(item.code)} ${duplicateBadge}</div>
                            <div class="code-time">${escapeHtml(item.time)}</div>
                        </div>
                        <button class="code-delete" onclick="deleteCode(${index})" title="حذف">✕</button>
                    </div>
                `;
            }).join('');
        }

        // ===== UPDATE COUNTER =====
        function updateCounter() {
            const el = document.getElementById('counter');
            const product = getActiveProduct();
            if (!el || !product) return;
            el.textContent = product.codes.length;
            el.classList.remove('bump');
            void el.offsetWidth;
            el.classList.add('bump');
        }

        // ===== ADD CODE (allows duplicates now) =====
        function addCode(code) {
            code = code.trim();
            if (!code) return;
            const product = getActiveProduct();
            if (!product) return;

            const now = new Date();
            const timeStr = now.toLocaleDateString('ar-EG') + ' ' + now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

            product.codes.push({ code, time: timeStr });
            saveProducts();
            renderCodesList();
            updateCounter();
            renderProductsStrip();
            playAddSound();
            showToast('✅ تمت الإضافة بنجاح', 'success');
        }

        // ===== REMOVE CODE (removes last occurrence) =====
        function removeCode(code) {
            code = code.trim();
            if (!code) return;
            const product = getActiveProduct();
            if (!product) return;

            // Find the LAST occurrence (LIFO - most recently added)
            let lastIndex = -1;
            for (let i = product.codes.length - 1; i >= 0; i--) {
                if (product.codes[i].code === code) {
                    lastIndex = i;
                    break;
                }
            }

            if (lastIndex === -1) {
                playErrorSound();
                showToast('⚠️ هذا الرقم غير موجود في القائمة!', 'error');
                return;
            }

            product.codes.splice(lastIndex, 1);
            saveProducts();
            renderCodesList();
            updateCounter();
            renderProductsStrip();
            playRemoveSound();
            showToast('🗑️ تم الحذف بنجاح', 'success');
        }

        // ===== DELETE SINGLE CODE =====
        function deleteCode(index) {
            const product = getActiveProduct();
            if (!product) return;
            product.codes.splice(index, 1);
            saveProducts();
            renderCodesList();
            updateCounter();
            renderProductsStrip();
            playRemoveSound();
            showToast('🗑️ تم الحذف', 'info');
        }

        // ===== CLEAR ALL CODES =====
        function clearAll() {
            const product = getActiveProduct();
            if (!product) return;
            if (product.codes.length === 0) return;
            if (confirm('هل أنت متأكد من حذف جميع الأرقام؟')) {
                product.codes = [];
                saveProducts();
                renderCodesList();
                updateCounter();
                renderProductsStrip();
                playRemoveSound();
                showToast('🗑️ تم مسح جميع الأرقام', 'info');
            }
        }

        // ===== NEW PRODUCT MODAL =====
        function renderEmojiPicker() {
            const picker = document.getElementById('emojiPicker');
            picker.innerHTML = defaultEmojis.map(e => `
                <div class="emoji-option ${e === selectedEmoji ? 'selected' : ''}" onclick="selectEmoji('${e}', this)">${e}</div>
            `).join('');
        }

        function selectEmoji(emoji, el) {
            selectedEmoji = emoji;
            document.querySelectorAll('.emoji-option').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
        }

        function openNewProductModal() {
            document.getElementById('newProductModal').classList.add('active');
            document.getElementById('newProductName').value = '';
            document.getElementById('newProductWeight').value = '';
            selectedEmoji = '📦';
            renderEmojiPicker();
            setTimeout(() => document.getElementById('newProductName').focus(), 100);
        }

        function closeNewProductModal() {
            document.getElementById('newProductModal').classList.remove('active');
        }

        function createNewProduct() {
            const name = document.getElementById('newProductName').value.trim();
            const weight = document.getElementById('newProductWeight').value.trim();

            if (!name) {
                playErrorSound();
                showToast('⚠️ الرجاء إدخال اسم المنتج', 'error');
                return;
            }

            const newProduct = {
                id: 'p_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                name,
                weight: weight || '',
                icon: selectedEmoji,
                codes: [],
                createdAt: Date.now()
            };

            products.push(newProduct);
            activeProductId = newProduct.id;
            saveProducts();
            renderProductsStrip();
            renderMainContent();
            closeNewProductModal();
            playAddSound();
            showToast('✅ تم إنشاء المنتج بنجاح', 'success');

            setTimeout(() => {
                const scroll = document.getElementById('productsScroll');
                scroll.scrollLeft = scroll.scrollWidth;
            }, 100);
        }

        // ===== SCANNER =====
        function openScanner(mode) {
            const product = getActiveProduct();
            if (!product) {
                playErrorSound();
                showToast('⚠️ الرجاء اختيار منتج أولاً', 'error');
                return;
            }
            currentMode = mode;
            const modal = document.getElementById('scannerModal');
            const title = document.getElementById('modalTitle');
            const subtitle = document.getElementById('modalSubtitle');

            if (mode === 'add') {
                title.textContent = `➕ إضافة رقم — ${product.name}`;
                subtitle.textContent = 'وجّه الكاميرا نحو الباركود أو أدخل الرقم يدوياً';
            } else {
                title.textContent = `➖ حذف رقم — ${product.name}`;
                subtitle.textContent = 'وجّه الكاميرا نحو الباركود أو أدخل الرقم يدوياً';
            }

            modal.classList.add('active');
            document.getElementById('manualCode').value = '';

            startCamera();
        }

        function closeScanner() {
            const modal = document.getElementById('scannerModal');
            modal.classList.remove('active');
            stopCamera();
        }

        function startCamera() {
            if (isScanning) return;

            html5QrCode = new Html5Qrcode("reader");

            const config = {
                fps: 10,
                qrbox: { width: 250, height: 100 },
                aspectRatio: 1.0
            };

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                onScanSuccess,
                () => {}
            ).then(() => {
                isScanning = true;
            }).catch(err => {
                console.error("Camera error:", err);
                playErrorSound();
                showToast('⚠️ تعذّر فتح الكاميرا - أدخل الرقم يدوياً', 'error');
            });
        }

        function stopCamera() {
            if (html5QrCode && isScanning) {
                html5QrCode.stop().then(() => {
                    isScanning = false;
                    html5QrCode.clear();
                }).catch(err => {
                    console.error("Stop error:", err);
                    isScanning = false;
                });
            }
        }

        function onScanSuccess(decodedText) {
            stopCamera();

            if (currentMode === 'add') {
                addCode(decodedText);
            } else {
                removeCode(decodedText);
            }

            setTimeout(() => closeScanner(), 500);
        }

        function handleManualInput() {
            const input = document.getElementById('manualCode');
            const code = input.value.trim();

            if (!code) {
                playErrorSound();
                showToast('⚠️ الرجاء إدخال رقم تسلسلي', 'error');
                return;
            }

            stopCamera();

            if (currentMode === 'add') {
                addCode(code);
            } else {
                removeCode(code);
            }

            setTimeout(() => closeScanner(), 500);
        }

        // Enter key for manual input
        document.getElementById('manualCode').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleManualInput();
        });

        // Close modals on overlay click
        document.getElementById('scannerModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeScanner();
        });
        document.getElementById('newProductModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeNewProductModal();
        });

        // Enter key for new product name
        document.getElementById('newProductName').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('newProductWeight').focus();
        });
        document.getElementById('newProductWeight').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') createNewProduct();
        });
    </script>
</body>
</html>
