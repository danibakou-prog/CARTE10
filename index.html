<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عدّاد المنتجات</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        /* ===== HEADER ===== */
        .header {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 18px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .header h1 {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            flex: 1;
            text-align: center;
        }

        .add-product-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: #fff;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 1.3rem;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
        }

        .add-product-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(102, 126, 234, 0.55);
        }

        .add-product-btn:active {
            transform: scale(0.95);
        }

        .add-product-btn .btn-text {
            font-size: 0.85rem;
        }

        /* ===== PRODUCTS STRIP ===== */
        .products-strip {
            background: rgba(255,255,255,0.03);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding: 14px 12px;
            position: sticky;
            top: 70px;
            z-index: 99;
            backdrop-filter: blur(15px);
        }

        .products-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 4px 2px;
            scroll-behavior: smooth;
            scrollbar-width: thin;
        }

        .products-scroll::-webkit-scrollbar {
            height: 4px;
        }

        .products-scroll::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
        }

        .product-chip {
            flex-shrink: 0;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            min-width: 160px;
        }

        .product-chip:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-2px);
        }

        .product-chip.active {
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.15), rgba(58, 123, 213, 0.15));
            border-color: #00d2ff;
            box-shadow: 0 6px 20px rgba(0, 210, 255, 0.2);
        }

        .chip-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .chip-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .chip-name {
            font-size: 0.9rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 110px;
        }

        .chip-weight {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.5);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chip-count {
            position: absolute;
            top: -6px;
            left: -6px;
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 10px;
            min-width: 24px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0, 176, 155, 0.4);
        }

        .chip-delete {
            position: absolute;
            top: -6px;
            right: -6px;
            background: linear-gradient(135deg, #eb3349, #f45c43);
            color: #fff;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-size: 0.75rem;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 10px rgba(235, 51, 73, 0.4);
            line-height: 1;
        }

        .product-chip:hover .chip-delete {
            display: flex;
        }

        .empty-strip {
            color: rgba(255,255,255,0.3);
            font-size: 0.85rem;
            text-align: center;
            padding: 8px;
            width: 100%;
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }

        /* ===== PRODUCT CARD ===== */
        .product-card {
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0,210,255,0.05) 0%, transparent 70%);
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .product-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            position: relative;
            z-index: 1;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.3);
        }

        .product-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
            position: relative;
            z-index: 1;
        }

        .product-weight {
            font-size: 0.95rem;
            color: rgba(255,255,255,0.5);
            margin-bottom: 24px;
            position: relative;
            z-index: 1;
        }

        /* ===== COUNTER ===== */
        .counter-display {
            position: relative;
            z-index: 1;
            margin-bottom: 10px;
        }

        .counter-number {
            font-size: 4.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            transition: transform 0.3s;
        }

        .counter-number.bump {
            animation: bump 0.3s ease;
        }

        @keyframes bump {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .counter-label {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.4);
            margin-top: 4px;
        }

        /* ===== BUTTONS ===== */
        .buttons-row {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-bottom: 28px;
            position: relative;
            z-index: 1;
        }

        .scan-btn {
            flex: 1;
            max-width: 160px;
            padding: 16px 10px;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            font-family: inherit;
            color: #fff;
        }

        .scan-btn:active {
            transform: scale(0.93);
        }

        .btn-add {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            box-shadow: 0 8px 30px rgba(0, 176, 155, 0.35);
        }

        .btn-add:hover {
            box-shadow: 0 12px 40px rgba(0, 176, 155, 0.5);
        }

        .btn-remove {
            background: linear-gradient(135deg, #eb3349, #f45c43);
            box-shadow: 0 8px 30px rgba(235, 51, 73, 0.35);
        }

        .btn-remove:hover {
            box-shadow: 0 12px 40px rgba(235, 51, 73, 0.5);
        }

        .btn-icon {
            font-size: 2rem;
            line-height: 1;
        }

        /* ===== CODES LIST ===== */
        .list-section {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 20px;
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .list-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .clear-btn {
            background: rgba(235, 51, 73, 0.2);
            border: 1px solid rgba(235, 51, 73, 0.4);
            color: #f45c43;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 0.8rem;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
        }

        .clear-btn:hover {
            background: rgba(235, 51, 73, 0.4);
        }

        .codes-list {
            max-height: 350px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .codes-list::-webkit-scrollbar {
            width: 4px;
        }

        .codes-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
        }

        .code-item {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideIn 0.3s ease;
            direction: ltr;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .code-text {
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
            color: #00d2ff;
            letter-spacing: 1px;
        }

        .code-time {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.3);
        }

        .code-delete {
            background: none;
            border: none;
            color: rgba(255,255,255,0.3);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .code-delete:hover {
            color: #f45c43;
            background: rgba(235, 51, 73, 0.15);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255,255,255,0.25);
        }

        .empty-state .empty-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .no-product-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255,255,255,0.4);
        }

        .no-product-state .big-icon {
            font-size: 4rem;
            margin-bottom: 16px;
        }

        .no-product-state .big-text {
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .no-product-state .create-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a2e;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .modal-subtitle {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.4);
            margin-bottom: 20px;
        }

        #reader {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        #reader video {
            border-radius: 16px;
        }

        .manual-input {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .manual-input input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.08);
            color: #fff;
            font-size: 1rem;
            font-family: 'Courier New', monospace;
            text-align: center;
            direction: ltr;
            outline: none;
        }

        .manual-input input:focus {
            border-color: #00d2ff;
        }

        .manual-input input::placeholder {
            color: rgba(255,255,255,0.25);
        }

        .manual-submit {
            padding: 12px 20px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95rem;
        }

        .close-modal {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
        }

        .close-modal:hover {
            background: rgba(255,255,255,0.1);
        }

        /* ===== NEW PRODUCT FORM ===== */
        .form-group {
            margin-bottom: 16px;
            text-align: right;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.6);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.08);
            color: #fff;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            text-align: right;
            direction: rtl;
        }

        .form-input:focus {
            border-color: #00d2ff;
        }

        .form-input::placeholder {
            color: rgba(255,255,255,0.25);
        }

        .emoji-picker {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            padding: 12px;
            background: rgba(255,255,255,0.04);
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
            max-height: 180px;
            overflow-y: auto;
        }

        .emoji-option {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            border: 2px solid transparent;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .emoji-option:hover {
            background: rgba(255,255,255,0.12);
            transform: scale(1.1);
        }

        .emoji-option.selected {
            border-color: #00d2ff;
            background: rgba(0, 210, 255, 0.15);
        }

        .submit-product-btn {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            margin-top: 10px;
            box-shadow: 0 8px 25px rgba(0, 176, 155, 0.35);
            transition: all 0.3s;
        }

        .submit-product-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 176, 155, 0.5);
        }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .toast {
            padding: 14px 24px;
            border-radius: 14px;
            font-size: 0.9rem;
            font-weight: 600;
            animation: toastIn 0.4s ease, toastOut 0.4s ease 2.6s forwards;
            white-space: nowrap;
            backdrop-filter: blur(20px);
            pointer-events: auto;
        }

        .toast-success {
            background: rgba(0, 176, 155, 0.9);
            color: #fff;
            box-shadow: 0 8px 30px rgba(0, 176, 155, 0.3);
        }

        .toast-error {
            background: rgba(235, 51, 73, 0.9);
            color: #fff;
            box-shadow: 0 8px 30px rgba(235, 51, 73, 0.3);
        }

        .toast-info {
            background: rgba(58, 123, 213, 0.9);
            color: #fff;
            box-shadow: 0 8px 30px rgba(58, 123, 213, 0.3);
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes toastOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-20px); }
        }

        /* ===== SOUND TOGGLE ===== */
        .sound-toggle {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .sound-toggle:hover {
            background: rgba(255,255,255,0.15);
            transform: scale(1.08);
        }

        .sound-toggle.muted {
            opacity: 0.4;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 380px) {
            .counter-number { font-size: 3.5rem; }
            .product-icon { width: 80px; height: 80px; font-size: 38px; }
            .header h1 { font-size: 1.1rem; }
            .add-product-btn .btn-text { display: none; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <button class="add-product-btn" onclick="openNewProductModal()" title="إضافة منتج جديد">
            <span>＋</span>
            <span class="btn-text">منتج</span>
        </button>
        <h1>📦 نظام عدّاد المنتجات</h1>
        <div style="width: 70px;"></div>
    </div>

    <!-- PRODUCTS STRIP -->
    <div class="products-strip">
        <div class="products-scroll" id="productsScroll"></div>
    </div>

    <!-- TOAST CONTAINER -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- SOUND TOGGLE -->
    <button class="sound-toggle" id="soundToggle" onclick="toggleSound()" title="تشغيل/إيقاف الصوت">
        🔊
    </button>

    <!-- MAIN -->
    <div class="container" id="mainContainer">
        <!-- Content will be rendered dynamically -->
    </div>

    <!-- SCANNER MODAL -->
    <div class="modal-overlay" id="scannerModal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">مسح الرقم التسلسلي</div>
            <div class="modal-subtitle" id="modalSubtitle">وجّه الكاميرا نحو الباركود أو الرقم التسلسلي</div>

            <div id="reader"></div>

            <div style="color: rgba(255,255,255,0.3); font-size: 0.8rem; margin-bottom: 12px;">— أو أدخل الرقم يدوياً —</div>

            <div class="manual-input">
                <input type="text" id="manualCode" placeholder="أدخل الرقم التسلسلي" />
                <button class="manual-submit" onclick="handleManualInput()">تأكيد</button>
            </div>

            <button class="close-modal" onclick="closeScanner()">إغلاق الكاميرا</button>
        </div>
    </div>

    <!-- NEW PRODUCT MODAL -->
    <div class="modal-overlay" id="newProductModal">
        <div class="modal-content">
            <div class="modal-title">➕ إضافة منتج جديد</div>
            <div class="modal-subtitle">أدخل بيانات المنتج الذي تريد إضافته</div>

            <div class="form-group">
                <label class="form-label">اسم المنتج</label>
                <input type="text" class="form-input" id="newProductName" placeholder="مثال: ورق A4" maxlength="30" />
            </div>

            <div class="form-group">
                <label class="form-label">الوصف / الوزن</label>
                <input type="text" class="form-input" id="newProductWeight" placeholder="مثال: 260 غرام / م²" maxlength="40" />
            </div>

            <div class="form-group">
                <label class="form-label">اختر أيقونة</label>
                <div class="emoji-picker" id="emojiPicker"></div>
            </div>

            <button class="submit-product-btn" onclick="createNewProduct()">✓ إنشاء المنتج</button>
            <button class="close-modal" style="margin-top: 10px;" onclick="closeNewProductModal()">إلغاء</button>
        </div>
    </div>

    <script>
        // ===== STATE =====
        let products = JSON.parse(localStorage.getItem('products_v2') || 'null');
        let activeProductId = localStorage.getItem('activeProductId') || null;
        let currentMode = 'add';
        let html5QrCode = null;
        let isScanning = false;
        let selectedEmoji = '📦';
        let soundEnabled = localStorage.getItem('soundEnabled') !== 'false';

        // ===== DEFAULT EMOJIS =====
        const defaultEmojis = ['📦','📄','📋','📎','🖨️','📚','📝','✏️','🎁','🛍️','🧴','🧼','🥤','🍫','🍪','☕','🧃','🥫','🧊','💊','🧪','🔌','💡','🔋','🧰','🔧','🪛','🧲','🧵','🪡','🧶','🎨','🖼️','🪴','🌱','🍎','🍌','🥖','🧀','🥩','🐟','🍗','🍕','🌮','🍔','🍟','🧁','🍰','🎂','🍩'];

        // ===== AUDIO CONTEXT (for sound effects) =====
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    console.warn('Web Audio API not supported');
                    return null;
                }
            }
            // Resume if suspended (browser autoplay policy)
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
            return audioCtx;
        }

        // Play a pleasant "success" tone (ascending two notes) for ADD
        function playAddSound() {
            if (!soundEnabled) return;
            const ctx = getAudioContext();
            if (!ctx) return;

            const now = ctx.currentTime;

            // Note 1: E5 (659 Hz)
            const osc1 = ctx.createOscillator();
            const gain1 = ctx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(659, now);
            gain1.gain.setValueAtTime(0, now);
            gain1.gain.linearRampToValueAtTime(0.25, now + 0.02);
            gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            osc1.connect(gain1);
            gain1.connect(ctx.destination);
            osc1.start(now);
            osc1.stop(now + 0.16);

            // Note 2: G#5 (831 Hz) - slightly delayed
            const osc2 = ctx.createOscillator();
            const gain2 = ctx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(831, now + 0.08);
            gain2.gain.setValueAtTime(0, now);
            gain2.gain.linearRampToValueAtTime(0.25, now + 0.1);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
            osc2.connect(gain2);
            gain2.connect(ctx.destination);
            osc2.start(now + 0.08);
            osc2.stop(now + 0.3);
        }

        // Play a "remove" tone (descending, lower pitch) for REMOVE
        function playRemoveSound() {
            if (!soundEnabled) return;
            const ctx = getAudioContext();
            if (!ctx) return;

            const now = ctx.currentTime;

            // Note 1: E4 (329 Hz)
            const osc1 = ctx.createOscillator();
            const gain1 = ctx.createGain();
            osc1.type = 'triangle';
            osc1.frequency.setValueAtTime(329, now);
            osc1.frequency.exponentialRampToValueAtTime(220, now + 0.18);
            gain1.gain.setValueAtTime(0, now);
            gain1.gain.linearRampToValueAtTime(0.25, now + 0.02);
            gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
            osc1.connect(gain1);
            gain1.connect(ctx.destination);
            osc1.start(now);
            osc1.stop(now + 0.23);

            // Note 2: C4 (261 Hz) - descending
            const osc2 = ctx.createOscillator();
            const gain2 = ctx.createGain();
            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(261, now + 0.1);
            osc2.frequency.exponentialRampToValueAtTime(165, now + 0.3);
            gain2.gain.setValueAtTime(0, now);
            gain2.gain.linearRampToValueAtTime(0.22, now + 0.12);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
            osc2.connect(gain2);
            gain2.connect(ctx.destination);
            osc2.start(now + 0.1);
            osc2.stop(now + 0.36);
        }

        // Play a soft "error" beep
        function playErrorSound() {
            if (!soundEnabled) return;
            const ctx = getAudioContext();
            if (!ctx) return;

            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(200, now);
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.12, now + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.16);
        }

        // ===== SOUND TOGGLE =====
        function toggleSound() {
            soundEnabled = !soundEnabled;
            localStorage.setItem('soundEnabled', soundEnabled);
            updateSoundButton();
            if (soundEnabled) {
                showToast('🔊 تم تشغيل الصوت', 'info');
                // Play a quick test tone
                playAddSound();
            } else {
                showToast('🔇 تم إيقاف الصوت', 'info');
            }
        }

        function updateSoundButton() {
            const btn = document.getElementById('soundToggle');
            if (!btn) return;
            btn.textContent = soundEnabled ? '🔊' : '🔇';
            btn.classList.toggle('muted', !soundEnabled);
        }

        // ===== MIGRATION FROM OLD FORMAT =====
        function migrateOldData() {
            if (!products) {
                const oldCodes = JSON.parse(localStorage.getItem('paper260_codes') || '[]');
                if (oldCodes.length > 0) {
                    const defaultProduct = {
                        id: 'p_' + Date.now(),
                        name: 'ورق طباعة',
                        weight: '260 غرام / م²',
                        icon: '📄',
                        codes: oldCodes,
                        createdAt: Date.now()
                    };
                    products = [defaultProduct];
                    activeProductId = defaultProduct.id;
                } else {
                    products = [];
                }
                saveProducts();
            }
        }

        // ===== INIT =====
        document.addEventListener('DOMContentLoaded', () => {
            migrateOldData();
            renderEmojiPicker();
            renderProductsStrip();
            renderMainContent();
            updateSoundButton();

            // Unlock audio on first user interaction (mobile browsers)
            const unlockAudio = () => {
                getAudioContext();
                document.removeEventListener('click', unlockAudio);
                document.removeEventListener('touchstart', unlockAudio);
            };
            document.addEventListener('click', unlockAudio);
            document.addEventListener('touchstart', unlockAudio);
        });

        // ===== SAVE =====
        function saveProducts() {
            localStorage.setItem('products_v2', JSON.stringify(products));
            localStorage.setItem('activeProductId', activeProductId || '');
        }

        function getActiveProduct() {
            return products.find(p => p.id === activeProductId);
        }

        // ===== TOAST =====
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // ===== RENDER PRODUCTS STRIP =====
        function renderProductsStrip() {
            const scroll = document.getElementById('productsScroll');

            if (products.length === 0) {
                scroll.innerHTML = `<div class="empty-strip">لا توجد منتجات — اضغط "＋ منتج" لإضافة منتج جديد</div>`;
                return;
            }

            scroll.innerHTML = products.map(p => `
                <div class="product-chip ${p.id === activeProductId ? 'active' : ''}" onclick="selectProduct('${p.id}')">
                    <div class="chip-icon">${p.icon}</div>
                    <div class="chip-info">
                        <div class="chip-name">${escapeHtml(p.name)}</div>
                        <div class="chip-weight">${escapeHtml(p.weight || '—')}</div>
                    </div>
                    <div class="chip-count">${p.codes.length}</div>
                    <button class="chip-delete" onclick="event.stopPropagation(); deleteProduct('${p.id}')" title="حذف المنتج">✕</button>
                </div>
            `).join('');
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        // ===== SELECT PRODUCT =====
        function selectProduct(id) {
            activeProductId = id;
            saveProducts();
            renderProductsStrip();
            renderMainContent();
        }

        // ===== DELETE PRODUCT =====
        function deleteProduct(id) {
            const p = products.find(x => x.id === id);
            if (!p) return;
            if (!confirm(`هل أنت متأكد من حذف المنتج "${p.name}" وكل أرقامه؟`)) return;

            products = products.filter(x => x.id !== id);
            if (activeProductId === id) {
                activeProductId = products.length > 0 ? products[0].id : null;
            }
            saveProducts();
            renderProductsStrip();
            renderMainContent();
            showToast('🗑️ تم حذف المنتج', 'info');
        }

        // ===== RENDER MAIN CONTENT =====
        function renderMainContent() {
            const container = document.getElementById('mainContainer');
            const product = getActiveProduct();

            if (!product) {
                container.innerHTML = `
                    <div class="product-card">
                        <div class="no-product-state">
                            <div class="big-icon">📦</div>
                            <div class="big-text">لا يوجد أي منتج بعد</div>
                            <button class="create-btn" onclick="openNewProductModal()">➕ إضافة منتج جديد</button>
                        </div>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <!-- PRODUCT CARD -->
                <div class="product-card">
                    <div class="product-icon">${product.icon}</div>
                    <div class="product-name">${escapeHtml(product.name)}</div>
                    <div class="product-weight">${escapeHtml(product.weight)}</div>

                    <div class="counter-display">
                        <div class="counter-number" id="counter">${product.codes.length}</div>
                        <div class="counter-label">العدد المسجّل</div>
                    </div>

                    <div class="buttons-row">
                        <button class="scan-btn btn-add" onclick="openScanner('add')">
                            <span class="btn-icon">＋</span>
                            <span>إضافة</span>
                        </button>
                        <button class="scan-btn btn-remove" onclick="openScanner('remove')">
                            <span class="btn-icon">－</span>
                            <span>حذف</span>
                        </button>
                    </div>
                </div>

                <!-- CODES LIST -->
                <div class="list-section">
                    <div class="list-header">
                        <span class="list-title">📋 الأرقام التسلسلية</span>
                        <button class="clear-btn" onclick="clearAll()">مسح الكل</button>
                    </div>
                    <div class="codes-list" id="codesList"></div>
                </div>
            `;

            renderCodesList();
        }

        // ===== RENDER CODES LIST =====
        function renderCodesList() {
            const list = document.getElementById('codesList');
            if (!list) return;
            const product = getActiveProduct();
            if (!product) return;

            if (product.codes.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📭</div>
                        <div>لا توجد أرقام مسجّلة بعد</div>
                    </div>`;
                return;
            }

            list.innerHTML = product.codes.map((item, index) => `
                <div class="code-item">
                    <div>
                        <div class="code-text">${escapeHtml(item.code)}</div>
                        <div class="code-time">${escapeHtml(item.time)}</div>
                    </div>
                    <button class="code-delete" onclick="deleteCode(${index})" title="حذف">✕</button>
                </div>
            `).join('');
        }

        // ===== UPDATE COUNTER =====
        function updateCounter() {
            const el = document.getElementById('counter');
            const product = getActiveProduct();
            if (!el || !product) return;
            el.textContent = product.codes.length;
            el.classList.remove('bump');
            void el.offsetWidth;
            el.classList.add('bump');
        }

        // ===== ADD CODE =====
        function addCode(code) {
            code = code.trim();
            if (!code) return;
            const product = getActiveProduct();
            if (!product) return;

            const exists = product.codes.find(c => c.code === code);
            if (exists) {
                playErrorSound();
                showToast('⚠️ هذا الرقم موجود بالفعل!', 'error');
                return;
            }

            const now = new Date();
            const timeStr = now.toLocaleDateString('ar-EG') + ' ' + now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

            product.codes.push({ code, time: timeStr });
            saveProducts();
            renderCodesList();
            updateCounter();
            renderProductsStrip();
            playAddSound();
            showToast('✅ تمت الإضافة بنجاح', 'success');
        }

        // ===== REMOVE CODE =====
        function removeCode(code) {
            code = code.trim();
            if (!code) return;
            const product = getActiveProduct();
            if (!product) return;

            const index = product.codes.findIndex(c => c.code === code);
            if (index === -1) {
                playErrorSound();
                showToast('⚠️ هذا الرقم غير موجود في القائمة!', 'error');
                return;
            }

            product.codes.splice(index, 1);
            saveProducts();
            renderCodesList();
            updateCounter();
            renderProductsStrip();
            playRemoveSound();
            showToast('🗑️ تم الحذف بنجاح', 'success');
        }

        // ===== DELETE SINGLE CODE =====
        function deleteCode(index) {
            const product = getActiveProduct();
            if (!product) return;
            product.codes.splice(index, 1);
            saveProducts();
            renderCodesList();
            updateCounter();
            renderProductsStrip();
            playRemoveSound();
            showToast('🗑️ تم الحذف', 'info');
        }

        // ===== CLEAR ALL CODES =====
        function clearAll() {
            const product = getActiveProduct();
            if (!product) return;
            if (product.codes.length === 0) return;
            if (confirm('هل أنت متأكد من حذف جميع الأرقام؟')) {
                product.codes = [];
                saveProducts();
                renderCodesList();
                updateCounter();
                renderProductsStrip();
                playRemoveSound();
                showToast('🗑️ تم مسح جميع الأرقام', 'info');
            }
        }

        // ===== NEW PRODUCT MODAL =====
        function renderEmojiPicker() {
            const picker = document.getElementById('emojiPicker');
            picker.innerHTML = defaultEmojis.map(e => `
                <div class="emoji-option ${e === selectedEmoji ? 'selected' : ''}" onclick="selectEmoji('${e}', this)">${e}</div>
            `).join('');
        }

        function selectEmoji(emoji, el) {
            selectedEmoji = emoji;
            document.querySelectorAll('.emoji-option').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
        }

        function openNewProductModal() {
            document.getElementById('newProductModal').classList.add('active');
            document.getElementById('newProductName').value = '';
            document.getElementById('newProductWeight').value = '';
            selectedEmoji = '📦';
            renderEmojiPicker();
            setTimeout(() => document.getElementById('newProductName').focus(), 100);
        }

        function closeNewProductModal() {
            document.getElementById('newProductModal').classList.remove('active');
        }

        function createNewProduct() {
            const name = document.getElementById('newProductName').value.trim();
            const weight = document.getElementById('newProductWeight').value.trim();

            if (!name) {
                playErrorSound();
                showToast('⚠️ الرجاء إدخال اسم المنتج', 'error');
                return;
            }

            const newProduct = {
                id: 'p_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                name,
                weight: weight || '',
                icon: selectedEmoji,
                codes: [],
                createdAt: Date.now()
            };

            products.push(newProduct);
            activeProductId = newProduct.id;
            saveProducts();
            renderProductsStrip();
            renderMainContent();
            closeNewProductModal();
            playAddSound();
            showToast('✅ تم إنشاء المنتج بنجاح', 'success');

            // Scroll to the new product chip
            setTimeout(() => {
                const scroll = document.getElementById('productsScroll');
                scroll.scrollLeft = scroll.scrollWidth;
            }, 100);
        }

        // ===== SCANNER =====
        function openScanner(mode) {
            const product = getActiveProduct();
            if (!product) {
                playErrorSound();
                showToast('⚠️ الرجاء اختيار منتج أولاً', 'error');
                return;
            }
            currentMode = mode;
            const modal = document.getElementById('scannerModal');
            const title = document.getElementById('modalTitle');
            const subtitle = document.getElementById('modalSubtitle');

            if (mode === 'add') {
                title.textContent = `➕ إضافة رقم — ${product.name}`;
                subtitle.textContent = 'وجّه الكاميرا نحو الباركود أو أدخل الرقم يدوياً';
            } else {
                title.textContent = `➖ حذف رقم — ${product.name}`;
                subtitle.textContent = 'وجّه الكاميرا نحو الباركود أو أدخل الرقم يدوياً';
            }

            modal.classList.add('active');
            document.getElementById('manualCode').value = '';

            startCamera();
        }

        function closeScanner() {
            const modal = document.getElementById('scannerModal');
            modal.classList.remove('active');
            stopCamera();
        }

        function startCamera() {
            if (isScanning) return;

            html5QrCode = new Html5Qrcode("reader");

            const config = {
                fps: 10,
                qrbox: { width: 250, height: 100 },
                aspectRatio: 1.0
            };

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                onScanSuccess,
                () => {}
            ).then(() => {
                isScanning = true;
            }).catch(err => {
                console.error("Camera error:", err);
                playErrorSound();
                showToast('⚠️ تعذّر فتح الكاميرا - أدخل الرقم يدوياً', 'error');
            });
        }

        function stopCamera() {
            if (html5QrCode && isScanning) {
                html5QrCode.stop().then(() => {
                    isScanning = false;
                    html5QrCode.clear();
                }).catch(err => {
                    console.error("Stop error:", err);
                    isScanning = false;
                });
            }
        }

        function onScanSuccess(decodedText) {
            stopCamera();

            if (currentMode === 'add') {
                addCode(decodedText);
            } else {
                removeCode(decodedText);
            }

            setTimeout(() => closeScanner(), 500);
        }

        function handleManualInput() {
            const input = document.getElementById('manualCode');
            const code = input.value.trim();

            if (!code) {
                playErrorSound();
                showToast('⚠️ الرجاء إدخال رقم تسلسلي', 'error');
                return;
            }

            stopCamera();

            if (currentMode === 'add') {
                addCode(code);
            } else {
                removeCode(code);
            }

            setTimeout(() => closeScanner(), 500);
        }

        // Enter key for manual input
        document.getElementById('manualCode').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleManualInput();
        });

        // Close modals on overlay click
        document.getElementById('scannerModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeScanner();
        });
        document.getElementById('newProductModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeNewProductModal();
        });

        // Enter key for new product name
        document.getElementById('newProductName').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('newProductWeight').focus();
        });
        document.getElementById('newProductWeight').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') createNewProduct();
        });
    </script>
</body>
</html>
